services:
  # 1. Feast Feature Server (REST Serving API)
  feast-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: feast-server
    command: ["serve"]
    environment:
      - MATERIALIZE=true
    ports:
      - "6566:6566"
    volumes:
      - ./feature_repo:/app
    networks:
      - feast-net
    restart: unless-stopped

  # 2. Feast Web UI (Catalog Dashboard)
  feast-ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: feast-ui
    command: ["ui"]
    environment:
      - MATERIALIZE=false
    ports:
      - "8888:8888"
    volumes:
      - ./feature_repo:/app
    networks:
      - feast-net
    restart: unless-stopped

networks:
  feast-net:
    driver: bridge
